name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish Kiso
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: node scripts/check-audit.mjs
      - run: npm run check
      - run: npm run check:react
      - name: Open the version PR or publish merged versions
        id: changesets
        # v2 reads the tag events Changesets 3 writes; v1 parsed the old CLI log.
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version:packages
          publish-script: npm run release
          pr-title: "chore: release kiso"
          commit-message: "chore: release kiso"
      # Changesets only tags the crates. Publish each crate version crates.io
      # lacks, once no changesets are pending, through crates.io trusted
      # publishing. Trusted publishing cannot create a crate, so a crate that
      # is not on crates.io yet waits for its first, manual publish.
      - name: Check which crates have a new version
        id: crate
        if: steps.changesets.outputs['has-changesets'] == 'false'
        run: |
          new=""
          for name in kiso-tokens kiso-core tui-kiso; do
            version=$(node -p "require('./crates/$name/package.json').version")
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'momoi-labs/blueprint release' "https://crates.io/api/v1/crates/$name")
            case "$status" in
              200) ;;
              404) echo "$name is not on crates.io yet. Publish it by hand first." && continue ;;
              *) echo "crates.io answered $status for $name." && exit 1 ;;
            esac
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'momoi-labs/blueprint release' "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version is already on crates.io." ;;
              404) new="$new $name" ;;
              *) echo "crates.io answered $status for $name $version." && exit 1 ;;
            esac
          done
          echo "new=${new# }" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io
        if: steps.crate.outputs.new != ''
      # The list keeps dependency order, so kiso-core lands before tui-kiso.
      - name: Publish the new crate versions
        if: steps.crate.outputs.new != ''
        run: |
          for name in ${{ steps.crate.outputs.new }}; do
            cargo publish --manifest-path "crates/$name/Cargo.toml"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
      - name: Require a tag and release for every published version
        run: node scripts/check-release-tags.mjs
        env:
          GH_TOKEN: ${{ github.token }}
