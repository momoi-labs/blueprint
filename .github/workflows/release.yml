name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish Kiso
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run check:react
      - name: Open the version PR or publish merged versions
        # v2 reads the tag events Changesets 3 writes; v1 parsed the old CLI log.
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version:packages
          publish-script: npm run release
          pr-title: "chore: release kiso"
          commit-message: "chore: release kiso"
      - name: Require a tag and release for every published version
        run: node scripts/check-release-tags.mjs
        env:
          GH_TOKEN: ${{ github.token }}
