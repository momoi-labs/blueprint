name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish Kiso
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run check:react
      - name: Open the version PR or publish merged versions
        uses: changesets/action@v1
        with:
          version: npm run version:packages
          publish: npm run release
          title: "chore: release kiso"
          commit: "chore: release kiso"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
