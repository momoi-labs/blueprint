name: Token checks

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tokens/**"
      - "crates/**"
      - "apps/kiso-gallery/src/generated/**"
      - "kiso/docs/components/**"
      - "style-dictionary.config.*"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    name: Build tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Validate DTCG 2025.10 conformance
        run: node scripts/validate-dtcg.mjs
      - name: Build tokens
        run: npm run build
      - name: Verify generated outputs
        run: |
          test -s tokens/build/tokens.css
          test -s tokens/build/tokens.json
          test -s tokens/build/tokens.d.ts
          test -s tokens/build/tokens.scss
          test -s crates/kiso-tokens/src/tokens.rs
          git diff --exit-code -- tokens/build/ crates/kiso-tokens/src/tokens.rs
      - name: Check component token references
        run: node scripts/check-component-token-refs.mjs

  rust:
    name: Test Rust crates
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test kiso-tokens
        run: cargo test --manifest-path crates/kiso-tokens/Cargo.toml
      - name: Lint kiso-core
        run: cargo clippy --manifest-path crates/kiso-core/Cargo.toml --all-targets -- -D warnings
      - name: Test kiso-core and check its generated files
        run: |
          cargo test --manifest-path crates/kiso-core/Cargo.toml
          git diff --exit-code -- crates/kiso-core/fixtures packages/kiso-react/src/generated
      - name: Lint tui-kiso
        run: cargo clippy --manifest-path crates/tui-kiso/Cargo.toml --all-targets -- -D warnings
      - name: Test tui-kiso
        run: cargo test --manifest-path crates/tui-kiso/Cargo.toml
      - name: Draw the tui-kiso gallery without a terminal
        run: |
          cargo run --manifest-path crates/tui-kiso/Cargo.toml --example gallery -- --snapshot "$RUNNER_TEMP/tui-kiso"
          test -s "$RUNNER_TEMP/tui-kiso/index.html"
      - name: Check the site's copy of the tui-kiso gallery
        run: |
          cargo run --manifest-path crates/tui-kiso/Cargo.toml --example gallery -- --json apps/kiso-gallery/src/generated/tui-gallery.json
          git diff --exit-code -- apps/kiso-gallery/src/generated/tui-gallery.json

  contrast:
    name: Check AA contrast
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check semantic token contrast
        run: node scripts/check-contrast.mjs tokens/tokens.json
