[package]
name = "kiso-core"
version = "0.1.0"
edition = "2021"
description = "Kiso component specs: one contract for the React, HTML, text and ratatui outputs"
license = "MIT"
homepage = "https://kiso.momoi-labs.dev"
repository = "https://github.com/momoi-labs/blueprint"
rust-version = "1.88"
readme = "README.md"
keywords = ["kiso", "design-system", "components", "ui"]
categories = ["gui", "command-line-interface"]
# The fixtures are written by the tests for the React parity check.
include = ["src/**", "README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12" }

[dev-dependencies]
serde_json = "1"
